document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rflow-x:auto}\n@media (max-width:1439px){body{width:max-content;min-width:100%}}<\u002Fstyle>\n<\u002Fhead>\n<body id=\"top\">\n\n<div class=\"scr\" id=\"cap\">\n  \n  <div class=\"hdr\"><img src=\"7a0b0d50-2106-43f9-b4cb-41869798d5f8\" alt=\"northramp\"><div class=\"nav\"><b>Capabilities<\u002Fb><a href=\"/careers-preview\">Careers<\u002Fa><a href=\"/about-preview\">About<\u002Fa><a href=\"/contact-preview\">Contact<\u002Fa><\u002Fdiv><\u002Fdiv>\n  <div class=\"hero\" style=\"height:400px\">\n    <img src=\"44fefb66-b726-4c6d-80d2-181a4caace1d\" alt=\"Engineers reviewing systems in a data center\" style=\"object-position:50% 30%\">\n    <div class=\"scrim\"><\u002Fdiv>\n    <div class=\"wrap\" style=\"position:relative;padding-top:158px\">\n      <div class=\"k\">Capabilities<\u002Fdiv>\n      <div style=\"font-size:38px;font-weight:800;color:#fff;margin-top:10px;letter-spacing:.5px;line-height:1.2;max-width:1000px\">STRATEGIC TECHNOLOGY AND IT SERVICES<br>FOR FEDERAL MISSIONS<\u002Fdiv>\n      <div class=\"p\" style=\"margin-top:12px;color:rgba(255,255,255,.85);font-size:16px\">Four things we do — and the programs where we have done them.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;padding:56px 0 48px;position:relative\"><div class=\"wrap\">\n    <div style=\"flex:1\">\n      <div class=\"k\">Who We Are<\u002Fdiv>\n      <div class=\"p\" style=\"max-width:940px;font-size:16.5px;margin-top:14px\">Northramp is a federal IT consulting firm that moves mission-critical systems forward — modernizing what agencies run today while building what the mission needs next. From secure AI and intelligent automation to scalable cloud architectures, we bring modern solutions to the government's hardest technology problems — grounded in sound judgment, disciplined execution, and deep federal experience. Agencies trust Northramp when core systems cannot afford to fail.<\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:center;margin-top:26px;flex-wrap:wrap\">\n        <a class=\"btn\" href=\"#proof\">READ THE CASE STUDIES<\u002Fa>\n        <a class=\"btn\" style=\"background:transparent;color:#c05a11;border:1.5px solid #f47b20;box-shadow:none\">THOUGHT LEADERSHIP<\u002Fa>\n        <a class=\"btn\" style=\"background:transparent;color:#1d2745;border:1.5px solid #1d2745;box-shadow:none\">DOWNLOAD OUR CAPABILITY STATEMENT<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div class=\"navy\" style=\"padding:40px 0 72px;position:relative\"><div class=\"wrap\">\n    <div style=\"text-align:center\"><div class=\"k\">What We Do<\u002Fdiv>\n    <div style=\"font-size:30px;font-weight:800;letter-spacing:.5px;margin-top:12px;color:#fff\">BUILT FOR THE MISSION.<br><span style=\"color:#5BC4B2\">POWERED BY CAPABILITY.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:stretch;margin-top:44px\">\n      <div style=\"align-self:center;width:44px;height:44px;border:1.5px solid rgba(255,255,255,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:19px;cursor:pointer;flex:none\">‹<\u002Fdiv>\n      <div style=\"flex:2.4;background:#fff;border-radius:14px;box-shadow:0 26px 60px rgba(0,0,0,.45);min-height:320px;padding:30px 32px;position:relative;overflow:hidden;flex-shrink:0\"><div style=\"position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#f47b20,#F2A81D)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:13px;font-weight:700;letter-spacing:2.5px;color:#f47b20\">01 / 04<\u002Fdiv><div style=\"font-size:21px;font-weight:700;color:#1d2745;margin-top:14px;letter-spacing:.5px;line-height:1.3\">CLOUD, AI &amp; AGILE<br>DELIVERY<\u002Fdiv><div class=\"p\" style=\"font-size:14.5px;margin-top:14px;padding-right:40px;color:#4a5470\">Modernizing platforms and delivery with production-grade AI, scalable cloud architectures, and Agile practices that increase speed, resilience, and mission impact — without disrupting operations. AI applied where it multiplies what our engineers can do, under human oversight and agency policy.<\u002Fdiv><div style=\"position:absolute;bottom:24px;right:28px;width:38px;height:38px;border:2px solid #f47b20;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#f47b20;font-size:17px\">→<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:24px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:320px;position:relative;overflow:hidden;opacity:.75;transform:scale(.97);transition:opacity .2s ease,transform .2s ease,background .2s ease;cursor:pointer\"><div class=\"mono\" style=\"position:absolute;top:14px;left:20px;font-size:44px;font-weight:700;color:rgba(255,255,255,.14)\">02<\u002Fdiv><div style=\"font-size:15.5px;font-weight:700;color:#fff;letter-spacing:.8px;line-height:1.4\">IT SERVICE MANAGEMENT &amp; CUSTOMER EXPERIENCE<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.6);margin-top:10px\">Transforming how agencies deliver and support services — human-centered digital experiences, modern service platforms, and streamlined workflows grounded in operational reality. Includes AI-assisted service operations, and threat detection and response built into the environments we run.<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:24px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:320px;position:relative;overflow:hidden;opacity:.75;transform:scale(.97);transition:opacity .2s ease,transform .2s ease,background .2s ease;cursor:pointer\"><div class=\"mono\" style=\"position:absolute;top:14px;left:20px;font-size:44px;font-weight:700;color:rgba(255,255,255,.14)\">03<\u002Fdiv><div style=\"font-size:15.5px;font-weight:700;color:#fff;letter-spacing:.8px;line-height:1.4\">STRATEGIC ENTERPRISE ARCHITECTURE<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.6);margin-top:10px\">Aligning mission, technology, and people — enterprise architecture and modernization roadmaps, IT governance, organizational change, and governance-aware planning that is feasible and durable.<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:24px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:320px;position:relative;overflow:hidden;opacity:.75;transform:scale(.97);transition:opacity .2s ease,transform .2s ease,background .2s ease;cursor:pointer\"><div class=\"mono\" style=\"position:absolute;top:14px;left:20px;font-size:44px;font-weight:700;color:rgba(255,255,255,.14)\">04<\u002Fdiv><div style=\"font-size:15.5px;font-weight:700;color:#fff;letter-spacing:.8px;line-height:1.4\">INTEGRATED ADVISORY &amp; PROGRAM LEADERSHIP<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.6);margin-top:10px\">Judgment and stability in high-stakes environments — program leadership through mission-critical change, acquisition and financial management support, risk reduction, and delivery governance that earns lasting trust.<\u002Fdiv><\u002Fdiv>\n      <div style=\"align-self:center;width:44px;height:44px;border:1.5px solid rgba(255,255,255,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:19px;cursor:pointer;flex:none\">›<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;justify-content:center;align-items:center;margin-top:30px\">\n      <i style=\"width:22px;height:4px;border-radius:2px;background:#f47b20\"><\u002Fi>\n      <i style=\"width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)\"><\u002Fi>\n      <i style=\"width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)\"><\u002Fi>\n      <i style=\"width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)\"><\u002Fi>\n    <\u002Fdiv>\n    <div class=\"mono\" style=\"font-size:11px;color:rgba(255,255,255,.45);margin-top:12px;text-align:center\">click any card → it slides into focus<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div id=\"difference\" style=\"background:#fff;padding:72px 0;scroll-margin-top:20px;position:relative\"><div class=\"wrap\"> \n    <div style=\"display:flex;gap:64px;align-items:flex-start\">\n      <div style=\"flex:1;max-width:400px\">\n        <div class=\"k\" style=\"color:#2E9C8B\">Why Northramp<\u002Fdiv>\n        <div style=\"font-size:28px;font-weight:800;color:#1d2745;margin-top:12px;letter-spacing:1px;line-height:1.25\">THE NORTHRAMP<br>DIFFERENCE<\u002Fdiv>\n        <div class=\"p\" style=\"margin-top:16px\">Big-firm capability without big-firm drag. As a smaller firm, our senior people stay hands-on in your delivery, decisions happen in days not quarters, and every engagement carries our reputation — so we don't have a B team.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.6;display:flex;gap:40px;padding-top:6px\">\n        <div style=\"flex:1;display:flex;flex-direction:column\">\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><span style=\"flex:1;width:2px;background:linear-gradient(#2E9C8B,#c9e6df)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:22px\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">Engineers + Advisors in One Team<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">Hands-on technical expertise and strategic guidance together.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><span style=\"flex:1;width:2px;background:linear-gradient(#2E9C8B,#c9e6df)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:22px\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">AI as a Multiplier<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">Production-grade AI and automation that extend what our people can do — not pilots or experiments.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:0\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">Mission-Aligned Modernization<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">Cloud, automation &amp; Agile designed around FedRAMP, FISMA, and NIST 800-53.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column\">\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><span style=\"flex:1;width:2px;background:linear-gradient(#2E9C8B,#c9e6df)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:22px\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">Adaptive Delivery &amp; Innovation<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">Agile and Lean practices with emerging technology, for secure and scalable solutions.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><span style=\"flex:1;width:2px;background:linear-gradient(#2E9C8B,#c9e6df)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:22px\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">Engaged Team, Every Level<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">From executives to analysts, everyone drives execution and mission success.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><span style=\"flex:1;width:2px;background:linear-gradient(#2E9C8B,#c9e6df)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:22px\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">Workplace Excellence<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">A six-time Washington, D.C. Top Workplace, recognized by WTOP News.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;flex:none\"><span style=\"width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#2E9C8B,#1d5a4f);margin-top:4px;box-shadow:0 0 0 3px rgba(46,156,139,.15)\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding-bottom:0\"><div style=\"font-size:15.5px;font-weight:700;color:#f47b20\">People as Our Third Differentiator<\u002Fdiv><div class=\"p\" style=\"font-size:13px;margin-top:5px;line-height:1.6\">Experienced engineers and advisors who are empowered to make decisions, invest in their growth, and shape the future of government technology.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div id=\"proof\" style=\"background:linear-gradient(175deg,#EAF6F3 0%,#F2F8F6 55%,#E4F1ED 100%);padding:88px 0;position:relative;scroll-margin-top:20px\"><div class=\"wrap\">\n    <div style=\"text-align:center\">\n      <div class=\"k\" style=\"color:#2E9C8B\">No-Fail, High-Pressure Programs<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:800;color:#1d2745;letter-spacing:1px;margin-top:10px\">PROOF IN PRODUCTION<\u002Fdiv>\n      <div class=\"p\" style=\"max-width:680px;margin:14px auto 0\">When missions are complex, stakes are high, and outcomes matter most, agencies trust Northramp. We deliver production-grade solutions that endure — within real federal constraints.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;background:#1d2745;border-radius:14px;overflow:hidden;box-shadow:0 20px 44px rgba(29,39,69,.25);margin-top:40px\">\n      <div style=\"width:42%;flex:none;position:relative\"><img src=\"923d1d09-db2e-4cf8-b831-de61b528d24b\" alt=\"Northramp advisor with a FEMA field team\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\u002Fdiv>\n      <div style=\"flex:1;padding:38px 42px\">\n        <div class=\"mono\" style=\"font-size:10.5px;font-weight:700;letter-spacing:2.5px;color:#F2A81D\">FLAGSHIP ENGAGEMENT<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;color:#fff;line-height:1.25;margin-top:10px\">FEMA · National Flood Insurance Program<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.72);margin-top:12px\">One of our longest-running and most technically diverse federal relationships. Northramp partners with FEMA across the Office of the Chief Information Officer and the NFIP — reestablishing enterprise IT governance and architecture, replatforming the NFIP Pivot cloud infrastructure, and modernizing its data platform, with AI adoption piloted under human-in-the-loop governance and no government data in unauthorized or public AI tools.<\u002Fdiv>\n        <div style=\"display:flex;gap:30px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)\">\n          <div><div style=\"font-size:19px;font-weight:800;color:#f47b20\">M → C<\u002Fdiv><div class=\"mono\" style=\"font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin-top:2px\">MAINFRAME TO CLOUD<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:19px;font-weight:800;color:#5BC4B2\">~50%<\u002Fdiv><div class=\"mono\" style=\"font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin-top:2px\">MONTHLY INFRASTRUCTURE COST<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:19px;font-weight:800;color:#F2A81D\">24H → 15M<\u002Fdiv><div class=\"mono\" style=\"font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin-top:2px\">DATA LATENCY<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:19px;font-weight:800;color:#fff\">GOVERNED<\u002Fdiv><div class=\"mono\" style=\"font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin-top:2px\">AI ADOPTION<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <a class=\"btn\" style=\"margin-top:24px;font-size:11px;padding:12px 24px\">READ THE CASE STUDY<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:18px\">\n      <div class=\"card\" style=\"border-top:3px solid #c07f06;padding:22px 24px\"><div class=\"mono\" style=\"font-size:10px;font-weight:700;letter-spacing:2px;color:#98a0ad\">NRC<\u002Fdiv><div style=\"font-size:14.5px;font-weight:700;color:#1d2745;line-height:1.35;margin-top:8px\">Enterprise IT planning &amp; regulatory systems<\u002Fdiv><div class=\"p\" style=\"font-size:12.5px;line-height:1.6;margin-top:8px\">Prime on FEDPASS — the NRC's primary platform for managing IT investments, tracking project performance, and reporting to agency leadership and OMB — sustained at 99% availability, 24 hours a day, alongside Agile enhancements across the agency's application portfolio. Also modernizing ADAMS Public Search and the Enhanced Electronic Hearing Docket, where deployment time has moved from days to 45 minutes.<\u002Fdiv><a class=\"mono\" style=\"display:inline-block;margin-top:12px;font-size:10.5px;font-weight:700;letter-spacing:1.5px\">CASE STUDY →<\u002Fa><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid #2E9C8B;padding:22px 24px\"><div class=\"mono\" style=\"font-size:10px;font-weight:700;letter-spacing:2px;color:#98a0ad\">NIH<\u002Fdiv><div style=\"font-size:14.5px;font-weight:700;color:#1d2745;line-height:1.35;margin-top:8px\">Multi-cloud for health research<\u002Fdiv><div class=\"p\" style=\"font-size:12.5px;line-height:1.6;margin-top:8px\">Secure multi-cloud engineering across Google Cloud, AWS and Azure under the NIH Center for Information Technology Cloud BPA — supporting the transition from FISMA Moderate to FISMA High, with delivery schedules streamlined by two to three weeks.<\u002Fdiv><a class=\"mono\" style=\"display:inline-block;margin-top:12px;font-size:10.5px;font-weight:700;letter-spacing:1.5px\">CASE STUDY →<\u002Fa><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid #f47b20;padding:22px 24px\"><div class=\"mono\" style=\"font-size:10px;font-weight:700;letter-spacing:2px;color:#98a0ad\">DFC<\u002Fdiv><div style=\"font-size:14.5px;font-weight:700;color:#1d2745;line-height:1.35;margin-top:8px\">Enterprise IT modernization &amp; AI roadmap<\u002Fdiv><div class=\"p\" style=\"font-size:12.5px;line-height:1.6;margin-top:8px\">Supporting the U.S. International Development Finance Corporation since 2018, through its OPIC transition and beyond — integrating enterprise IT capabilities across program and vendor management, governance, cybersecurity, infrastructure, low-code platforms, and AI, so DFC can modernize mission-critical systems while reducing risk. Currently supporting DFC's enterprise AI Roadmap.<\u002Fdiv><a class=\"mono\" style=\"display:inline-block;margin-top:12px;font-size:10.5px;font-weight:700;letter-spacing:1.5px\">CASE STUDY →<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:22px;align-items:center;background:#fff;border:1px solid #d9ece6;border-left:4px solid #F2A81D;border-radius:12px;padding:22px 28px;margin-top:18px;box-shadow:0 10px 26px rgba(29,39,69,.08)\">\n      <div class=\"mono\" style=\"flex:none;font-size:11px;font-weight:700;letter-spacing:2.5px;color:#c07f06\">RECOGNITION<\u002Fdiv>\n      <div class=\"p\" style=\"font-size:13.5px;margin:0\">FEMA's National Flood Insurance Program modernization was recognized with a Google Cloud Public Sector Customer Award. Northramp is a listed Google Cloud partner — Co-sell Partner and Services Partner — with Google-certified engineers across cloud infrastructure, data analytics, application modernization, and AI.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div style=\"background:linear-gradient(160deg,#5BC4B2 0%,#7CCABC 55%,#A8DCD1 100%);padding:88px 0;position:relative;overflow:hidden\">\n    <svg width=\"430\" height=\"430\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"position:absolute;right:-85px;top:50%;transform:translateY(-50%) rotate(8deg);opacity:.13\"><circle cx=\"12\" cy=\"12\" r=\"10.6\" stroke=\"#1d2745\" stroke-width=\"1.1\"><\u002Fcircle>
